{{- if .Values.monitoring.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitor-ingress
  namespace: {{ .Values.monitoring.namespace }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.monitoring.ingress.class | quote }}
    networking.gke.io/managed-certificates: monitor-cert
spec:
  ingressClassName: {{ .Values.monitoring.ingress.class }}
  rules:
    - host: {{ .Values.monitoring.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.monitoring.ingress.serviceName }}
                port:
                  number: {{ .Values.monitoring.ingress.servicePort }}
{{- end }}
