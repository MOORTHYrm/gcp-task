name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy (dev/staging/prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      confirm_destroy:
        description: 'Type DESTROY to confirm'
        required: true
        type: string

env:
  TF_VERSION: 1.8.5
  TF_WORKING_DIR: terraform

jobs:
  # ── Safety Gate ─────────────────────────────────────────────────────────────
  validate-input:
    name: Validate Destroy Confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check Confirmation Input
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "❌ Confirmation failed. You must type DESTROY to proceed."
            exit 1
          fi
          echo "✅ Confirmation accepted. Proceeding with destroy..."

  # ── Destroy Job ─────────────────────────────────────────────────────────────
  terraform-destroy:
    name: Terraform Destroy - ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    needs: validate-input
    environment: ${{ github.event.inputs.environment }}   # Requires manual approval in GitHub Environments
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── GCP Auth ─────────────────────────────────────────────────────────────
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/644777661209/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: terraform-github@project-6b73a1f9-ef42-4074-81a.iam.gserviceaccount.com

      - name: Setup GCloud
        uses: google-github-actions/setup-gcloud@v2

      # ── Terraform Setup ───────────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── Init ─────────────────────────────────────────────────────────────────
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="prefix=gcp-task/${{ github.event.inputs.environment }}"
        env:
          TF_VAR_environment: ${{ github.event.inputs.environment }}

      # ── Check & Clear Stale Lock ──────────────────────────────────────────────
      - name: Check and Clear Stale State Lock
        run: |
          LOCK_FILE="gs://moorthy-terraform-state/gcp-task/${{ github.event.inputs.environment }}/default.tflock"
          
          if gsutil -q stat $LOCK_FILE; then
            echo "⚠️  Lock file found. Checking if stale..."
            LOCK_ID=$(gsutil cat $LOCK_FILE | python3 -c \
              "import sys, json; data=json.load(sys.stdin); print(data.get('ID',''))" 2>/dev/null || echo "")
            
            if [ -n "$LOCK_ID" ]; then
              echo "🔓 Force unlocking stale lock ID: $LOCK_ID"
              terraform force-unlock -force $LOCK_ID || true
            else
              echo "🗑️  Removing lock file directly..."
              gsutil rm $LOCK_FILE || true
            fi
          else
            echo "✅ No stale lock found. Proceeding..."
          fi

      # ── Destroy Plan ──────────────────────────────────────────────────────────
      - name: Terraform Destroy Plan
        id: destroy_plan
        run: |
          terraform plan \
            -destroy \
            -out=destroy.tfplan \
            -var="environment=${{ github.event.inputs.environment }}" \
            -lock-timeout=60s \
            2>&1 | tee destroy-plan-output.txt
          echo "plan_exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      # ── Show Plan Summary ─────────────────────────────────────────────────────
      - name: Show Destroy Plan Summary
        run: |
          echo "## 🔴 Resources to be DESTROYED" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          terraform show -no-color destroy.tfplan | grep -E "^  # |will be destroyed" >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      # ── Upload Plan Artifact ──────────────────────────────────────────────────
      - name: Upload Destroy Plan
        uses: actions/upload-artifact@v4
        with:
          name: destroy-plan-${{ github.event.inputs.environment }}-${{ github.run_id }}
          path: |
            ${{ env.TF_WORKING_DIR }}/destroy.tfplan
            ${{ env.TF_WORKING_DIR }}/destroy-plan-output.txt
          retention-days: 7

      # ── Apply Destroy ─────────────────────────────────────────────────────────
      - name: Terraform Destroy Apply
        id: destroy_apply
        run: |
          terraform apply \
            -auto-approve \
            -lock-timeout=120s \
            destroy.tfplan
        env:
          TF_VAR_environment: ${{ github.event.inputs.environment }}

      # ── Release Lock on Failure ───────────────────────────────────────────────
      - name: Release Lock on Failure
        if: failure()
        run: |
          echo "⚠️  Destroy failed. Attempting to release state lock..."
          LOCK_FILE="gs://moorthy-terraform-state/gcp-task/${{ github.event.inputs.environment }}/default.tflock"
          
          if gsutil -q stat $LOCK_FILE 2>/dev/null; then
            LOCK_ID=$(gsutil cat $LOCK_FILE | python3 -c \
              "import sys, json; print(json.load(sys.stdin).get('ID',''))" 2>/dev/null || echo "")
            if [ -n "$LOCK_ID" ]; then
              terraform force-unlock -force $LOCK_ID
              echo "🔓 Lock $LOCK_ID released."
            fi
          fi

      # ── Notify Success ────────────────────────────────────────────────────────
      - name: Notify Destroy Complete
        if: success()
        run: |
          echo "## ✅ Destroy Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Destroyed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

      # ── Notify Failure ────────────────────────────────────────────────────────
      - name: Notify Destroy Failed
        if: failure()
        run: |
          echo "## ❌ Destroy FAILED" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Check logs above for details." >> $GITHUB_STEP_SUMMARY
