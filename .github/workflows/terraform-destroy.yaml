name: Terraform Destroy

on:
  workflow_dispatch:

env:
  TF_VERSION: 1.8.5
  TF_WORKING_DIR: terraform

jobs:
  terraform-destroy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/644777661209/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: terraform-github@project-6b73a1f9-ef42-4074-81a.iam.gserviceaccount.com

      - name: Setup GCloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy Plan
        run: terraform plan -destroy -out=destroy.tfplan

      - name: Upload Destroy Plan
        uses: actions/upload-artifact@v4
        with:
          name: destroy-plan
          path: terraform/destroy.tfplan

      - name: Terraform Destroy
        run: terraform apply -auto-approve destroy.tfplan
