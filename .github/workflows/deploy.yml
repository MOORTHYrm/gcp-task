name: Build & Deploy to GKE

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PROJECT_ID: project-6b73a1f9-ef42-4074-81a
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: pythontest
  IMAGE: python-app
  GKE_CLUSTER: prod-cluster
  GKE_ZONE: us-central1-a       # prod-zone

jobs:
  # ──────────────────────────────────────────
  # JOB 1 — Lint & Test
  # ──────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint with flake8
        run: flake8 app.py --max-line-length=120 --ignore=E501

      - name: Run tests
        run: |
          # Add pytest tests here
          echo "Tests passed (add tests/test_app.py for real tests)"

  # ──────────────────────────────────────────
  # JOB 2 — Build & Push to Artifact Registry
  # ──────────────────────────────────────────
  build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker to use Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Generate image tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Image tag: ${SHORT_SHA}"

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}" \
            --tag "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest" \
            --label "git-commit=${{ github.sha }}" \
            --label "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

      - name: Push to Artifact Registry
        run: |
          docker push "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}"
          docker push "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest"

  # ──────────────────────────────────────────
  # JOB 3 — Deploy to GKE
  # ──────────────────────────────────────────
  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Install gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Substitute image tag in deployment manifest
        run: |
          IMAGE_FULL="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ needs.build-push.outputs.image_tag }}"
          sed -i "s|image:.*python-app.*|image: ${IMAGE_FULL}|g" k8s/deployment.yaml
          echo "Deploying image: ${IMAGE_FULL}"

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/python-app --timeout=300s

      - name: Verify deployment
        run: |
          echo "── Pods ──────────────────────────────────────"
          kubectl get pods -l app=python-app
          echo "── Service ───────────────────────────────────"
          kubectl get service python-app-service
          echo "── Ingress ───────────────────────────────────"
          kubectl get ingress python-app-ingress
          echo "── ManagedCertificate ────────────────────────"
          kubectl get managedcertificate python-app-cert

      - name: Post deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.IMAGE }}:${{ needs.build-push.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Cluster | \`${{ env.GKE_CLUSTER }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Zone | \`${{ env.GKE_ZONE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Domain | https://devopstrends.online |" >> $GITHUB_STEP_SUMMARY
