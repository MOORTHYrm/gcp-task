name: Build & Deploy to GKE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: project-6b73a1f9-ef42-4074-81a
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: pythontest
  IMAGE: python-app
  GKE_CLUSTER: prod-cluster
  GKE_ZONE: us-central1-a
  HELM_CHART_PATH: ./helm/python-app
  NAMESPACE: default

permissions:
  contents: write
  id-token: write
  issues: write

# ──────────────────────────────────────────────────────────────────────────────
# JOB 1 — Lint & Test
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt flake8

      - name: Run Flake8 lint
        run: flake8 app.py --max-line-length=120 --ignore=E501

# ──────────────────────────────────────────────────────────────────────────────
# JOB 2 — Secret Scanning
# ──────────────────────────────────────────────────────────────────────────────
  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

# ──────────────────────────────────────────────────────────────────────────────
# JOB 3 — Build & Push Docker Image
# ──────────────────────────────────────────────────────────────────────────────
  build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, gitleaks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_full: ${{ steps.meta.outputs.image_full }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Generate image tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_FULL="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${SHORT_SHA}"
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image_full=${IMAGE_FULL}" >> $GITHUB_OUTPUT
          echo "Built image tag: ${SHORT_SHA}"

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ steps.meta.outputs.image_full }}" \
            --tag "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest" \
            --label "git-commit=${{ github.sha }}" \
            --label "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

      - name: Push Docker image
        run: |
          docker push "${{ steps.meta.outputs.image_full }}"
          docker push "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest"

      - name: Update image tag in values.yaml (GitOps)
        run: |
          SHORT_SHA="${{ steps.meta.outputs.tag }}"

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # Update the tag in values.yaml
          sed -i "s/^  tag: .*/  tag: \"${SHORT_SHA}\"/" ${{ env.HELM_CHART_PATH }}/values.yaml

          # Stage the file
          git add ${{ env.HELM_CHART_PATH }}/values.yaml

          # Only proceed if there is a real change
          if git diff --staged --quiet; then
            echo "No changes to commit — tag already up to date"
            exit 0
          fi

          git commit -m "ci: update image tag to ${SHORT_SHA} [skip ci]"

          # Fetch latest remote, rebase our commit on top, then push
          git fetch origin main
          git rebase origin/main
          git push origin main

# ──────────────────────────────────────────────────────────────────────────────
# JOB 4 — Trivy Image Scan (HIGH & CRITICAL only)
# ──────────────────────────────────────────────────────────────────────────────
  trivy-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
      security-events: write   # required to upload SARIF to GitHub Security tab

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Pull image for scanning
        run: docker pull "${{ needs.build-push.outputs.image_full }}"

      # ── Fail the job if any HIGH or CRITICAL CVEs are found ──────────────
      - name: Trivy scan — exit on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ needs.build-push.outputs.image_full }}
          format: table
          exit-code: "1"              # non-zero = block the pipeline
          ignore-unfixed: true        # skip vulns with no available fix
          severity: HIGH,CRITICAL     # only care about HIGH and CRITICAL
          vuln-type: os,library

      # ── Always upload a SARIF report to GitHub Security tab ──────────────
      - name: Trivy scan — SARIF report (always)
        if: always()
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ needs.build-push.outputs.image_full }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: HIGH
          vuln-type: os,library

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

# ──────────────────────────────────────────────────────────────────────────────
# JOB 5 — Helm Lint
# ──────────────────────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm Lint & Validate
    runs-on: ubuntu-latest
    needs: trivy-scan                 # only lint if image passed security scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Helm lint
        run: helm lint ${{ env.HELM_CHART_PATH }}

      - name: Helm template dry-run
        run: |
          helm template python-app ${{ env.HELM_CHART_PATH }} \
            --set image.tag=${{ needs.build-push.outputs.image_tag }} \
            --debug

# ──────────────────────────────────────────────────────────────────────────────
# JOB 6 — Deploy to GKE via Helm
# ──────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GKE (Helm)
    runs-on: ubuntu-latest
    needs: [build-push, helm-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Clear stuck Helm release (if any)
        run: |
          STATUS=$(helm status python-app -n ${{ env.NAMESPACE }} \
            --output json 2>/dev/null | \
            jq -r '.info.status' 2>/dev/null || echo "not-found")

          echo "Current Helm release status: $STATUS"

          if [[ "$STATUS" == "pending-install" || \
                "$STATUS" == "pending-upgrade" || \
                "$STATUS" == "pending-rollback" ]]; then
            echo "Stuck release found — clearing secrets..."
            kubectl get secret -n ${{ env.NAMESPACE }} \
              -l name=python-app \
              -o jsonpath='{.items[-1].metadata.name}' | \
              xargs kubectl delete secret -n ${{ env.NAMESPACE }} --ignore-not-found
            echo "Cleared. Proceeding with deploy."
          else
            echo "No stuck release. Proceeding normally."
          fi

      - name: Deploy via Helm
        run: |
          IMAGE_TAG="${{ needs.build-push.outputs.image_tag }}"

          helm upgrade --install python-app ${{ env.HELM_CHART_PATH }} \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set image.tag=${IMAGE_TAG} \
            --set image.repository=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }} \
            --set resources.requests.cpu=50m \
            --set resources.limits.cpu=100m \
            --set replicaCount=1 \
            --wait \
            --timeout 10m \
            --atomic \
            --history-max 5

      - name: Verify deployment
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "        DEPLOYMENT VERIFICATION"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          echo ""
          echo "=== Helm Release Status ==="
          helm status python-app -n ${{ env.NAMESPACE }}

          echo ""
          echo "=== Helm History ==="
          helm history python-app -n ${{ env.NAMESPACE }}

          echo ""
          echo "=== Running Pods ==="
          kubectl get pods -l app=python-app -n ${{ env.NAMESPACE }} -o wide

          echo ""
          echo "=== Services ==="
          kubectl get svc -n ${{ env.NAMESPACE }}

          echo ""
          echo "=== Ingress ==="
          kubectl get ingress -n ${{ env.NAMESPACE }}

          echo ""
          echo "=== Rollout Status ==="
          kubectl rollout status deployment/python-app \
            -n ${{ env.NAMESPACE }} \
            --timeout=300s

# ──────────────────────────────────────────────────────────────────────────────
# JOB 7 — ArgoCD Sync
# ──────────────────────────────────────────────────────────────────────────────
  argocd-sync:
    name: ArgoCD Sync
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/

      - name: ArgoCD Login
        run: |
          argocd login ${{ secrets.ARGOCD_SERVER }} \
            --username admin \
            --password ${{ secrets.ARGOCD_PASSWORD }} \
            --insecure

      - name: Sync ArgoCD App
        run: |
          argocd app sync python-app --force
          argocd app wait python-app \
            --sync \
            --health \
            --timeout 300

      - name: ArgoCD App Status
        run: argocd app get python-app

# ──────────────────────────────────────────────────────────────────────────────
# JOB 8 — Slack Notification
# ──────────────────────────────────────────────────────────────────────────────
  slack-notify:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: [test, gitleaks, build-push, trivy-scan, helm-lint, deploy, argocd-sync]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    steps:
      - name: Determine pipeline status
        id: status
        run: |
          # Pipeline succeeds only when every critical job succeeded
          if [[ "${{ needs.test.result }}"        == "success" && \
                "${{ needs.gitleaks.result }}"    == "success" && \
                "${{ needs.build-push.result }}"  == "success" && \
                "${{ needs.trivy-scan.result }}"  == "success" && \
                "${{ needs.helm-lint.result }}"   == "success" && \
                "${{ needs.deploy.result }}"      == "success" && \
                "${{ needs.argocd-sync.result }}" == "success" ]]; then
            echo "color=#36a64f"           >> $GITHUB_OUTPUT
            echo "icon=:white_check_mark:" >> $GITHUB_OUTPUT
            echo "text=Pipeline Succeeded" >> $GITHUB_OUTPUT
          else
            echo "color=#e01e5a" >> $GITHUB_OUTPUT
            echo "icon=:x:"      >> $GITHUB_OUTPUT
            echo "text=Pipeline Failed" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ steps.status.outputs.color }}",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "${{ steps.status.outputs.icon }} ${{ steps.status.outputs.text }}"
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        { "type": "mrkdwn", "text": "*Repo:*\n${{ github.repository }}" },
                        { "type": "mrkdwn", "text": "*Branch:*\n${{ github.ref_name }}" },
                        { "type": "mrkdwn", "text": "*Commit:*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>" },
                        { "type": "mrkdwn", "text": "*Actor:*\n${{ github.actor }}" },
                        { "type": "mrkdwn", "text": "*Image Tag:*\n${{ needs.build-push.outputs.image_tag }}" },
                        { "type": "mrkdwn", "text": "*Test:*\n${{ needs.test.result || 'skipped' }}" },
                        { "type": "mrkdwn", "text": "*Gitleaks:*\n${{ needs.gitleaks.result || 'skipped' }}" },
                        { "type": "mrkdwn", "text": "*Trivy Scan:*\n${{ needs.trivy-scan.result || 'skipped' }}" },
                        { "type": "mrkdwn", "text": "*Helm Lint:*\n${{ needs.helm-lint.result || 'skipped' }}" },
                        { "type": "mrkdwn", "text": "*Deploy:*\n${{ needs.deploy.result || 'skipped' }}" },
                        { "type": "mrkdwn", "text": "*ArgoCD Sync:*\n${{ needs.argocd-sync.result || 'skipped' }}" }
                      ]
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": { "type": "plain_text", "text": ":rocket: View Run" },
                          "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        },
                        {
                          "type": "button",
                          "text": { "type": "plain_text", "text": ":globe_with_meridians: Open App" },
                          "url": "https://devopstrends.online"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
